
<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
</head>

<body>

    <div>
        <h1>LIBRARY MANAGEMENT SYSTEM</h1>

        <h2>Student Details</h2>

        <div>
            <label>Student Name:</label>
            <input type="text" id="name" oninput="updateDetails()">
        </div>

        <div>
            <label>Age:</label>
            <input type="number" id="age" oninput="updateDetails()">
        </div>

        <div>
            <label>Department:</label>
            <input type="text" id="department">
        </div>

        <div>
            <label>Semester:</label>
            <input type="text" id="semester">
        </div>

        <h2>Student Information</h2>

        <div id="studentDetails"></div>

        <hr>

        <div id="library"></div>

    </div>

    <script>

        // Parent Controller
        function ParentController() {

            let name = "";
            let age = "";

            let department = "Computer Science";
            let semester = "4th Semester";

            let books = [
                "Python Programming",
                "Java Programming",
                "Web Technology",
                "Database Management System",
                "Operating System",
                "Computer Networks"
            ];

            // Two-way binding for name and age
            window.updateDetails = function() {

                name = document.getElementById("name").value;
                age = document.getElementById("age").value;

                document.getElementById("studentDetails").innerHTML =
                    "<div>Name: " + name + "</div>" +
                    "<div>Age: " + age + "</div>" +
                    "<div>Department: " + department + "</div>" +
                    "<div>Semester: " + semester + "</div>";
            };

            // Display department and semester
            document.getElementById("department").value = department;
            document.getElementById("semester").value = semester;

            // Child Controller
            ChildController(books);

            updateDetails();
        }

        // Child Controller
        function ChildController(books) {

            let output = "<h2>LIBRARY BOOKS</h2>";
            output += "<h3>Available Books</h3>";

            for (let i = 0; i < books.length; i++) {

                output += "<div>" + (i + 1) + ". " +
                          books[i] + "</div>";
            }

            document.getElementById("library").innerHTML = output;
        }

        // Run Parent Controller
        ParentController();

    </script>

</body>
</html>
